[project]
name = "colorize"
version = "0.1.0"
description = "Offline desktop color manager with an Adobe-style interface"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "PyQt6>=6.8",
    "PyQt6Ads>=4.4",
    "coloraide>=4.0",
    "numpy>=2.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.gui-scripts]
colorize = "colorize.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
